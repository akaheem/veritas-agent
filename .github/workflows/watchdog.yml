# GitHub Actions watchdog — recovery executor when the Codespace dies.
#
# Runs every 15 min during US market hours on trading days. Reads the paper
# account via alpaca-py (repo secrets); if the market is open and the agent
# has not committed fresh state recently, re-runs one agent cycle in Actions.
#
# Actions does NOT keep a codespace alive — backup executor, not a keep-alive.

name: veritas-watchdog

on:
  workflow_dispatch: {}
  schedule:
    # 13:30–19:45 UTC ≈ 9:30–15:45 ET, Mon–Fri
    - cron: "30 13 * * 1-5"
    - cron: "*/15 14-19 * * 1-5"
    - cron: "45 19 * * 1-5"

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install uv
          uv sync --frozen

      - name: Reconcile + single cycle if stale
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERITAS_KILL_MODE: halt_new   # watchdog never opens new risk autonomously
        run: |
          uv run python tools/watchdog_check.py
          if [ -f .watchdog_run_cycle ]; then
            uv run python -m veritas.main --mode paper --once --dry-run || true
            rm .watchdog_run_cycle
          fi

      - name: Commit dashboard state
        run: |
          if [ -n "$(git status --porcelain dashboard/data 2>/dev/null)" ]; then
            git config user.name "veritas-watchdog"
            git config user.email "actions@users.noreply.github.com"
            git add dashboard/data
            git commit -m "watchdog: state refresh [skip ci]"
            git push
          fi
