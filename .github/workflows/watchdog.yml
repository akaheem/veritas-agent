# GitHub Actions watchdog — RECOVERY ONLY (Master Plan v2 ownership rule).
#
# Verifies broker reachability and dashboard freshness; re-runs at most one
# dry-run reconciliation cycle if state is stale. It NEVER opens positions
# (halt_new is forced) and never runs a second strategy brain.

name: veritas-watchdog

on:
  workflow_dispatch: {}
  schedule:
    # 13:30–19:45 UTC ≈ 9:30–15:45 ET, Mon–Fri
    - cron: "30 13 * * 1-5"
    - cron: "*/15 14-19 * * 1-5"
    - cron: "45 19 * * 1-5"

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install uv
          uv sync --frozen
          uv pip install pytest

      - name: Reconcile only (recovery, never trades)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERITAS_KILL_MODE: halt_new   # ownership rule: watchdog cannot trade
        run: |
          uv run python tools/watchdog_check.py
          if [ -f .watchdog_run_cycle ]; then
            uv run python -m veritas.main --mode paper --once --dry-run || true
            rm .watchdog_run_cycle
          fi

      - name: Commit dashboard state
        run: |
          if [ -n "$(git status --porcelain dashboard/data 2>/dev/null)" ]; then
            git config user.name "veritas-watchdog"
            git config user.email "actions@users.noreply.github.com"
            git add dashboard/data
            git commit -m "watchdog: state refresh [skip ci]"
            git push
          fi
