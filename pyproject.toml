[project]
name = "veritas-agent"
version = "0.1.0"
description = "Execution-aware autonomous options credit-spread agent for Alpaca paper trading"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "alpaca-py>=0.44.0",
    "alpaca-mcp-server>=2.3.1",
    "anthropic>=0.69.0",
    "mcp>=1.16.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
veritas = "veritas.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veritas"]

[tool.ruff]
line-length = 100
target-version = "py311"
