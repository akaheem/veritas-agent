      <rect x="96" y="452" width="3" height="30" fill="#6c8cff" opacity="0.8"/>
      <g fill="#b9c8ff" opacity="0.95">
        <text x="110" y="474">5960</text><text x="205" y="474">10.20</text><text x="305" y="474">0.58</text>
      </g>
    </g>
  </g>

