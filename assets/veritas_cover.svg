  <text x="1840" y="78" font-size="18" letter-spacing="3" fill="#8394bd" text-anchor="end">ALPACA HACKATHON &#183; 2026</text>
  <line x1="80" y1="112" x2="1840" y2="112" stroke="#6c8cff" stroke-opacity="0.18" stroke-width="1"/>

