  <text x="962" y="242" font-size="17" letter-spacing="2" fill="#8fa3d4" opacity="0.75" text-anchor="middle">MKT OPEN &#183; GREEKS IN BOUNDS &#183; LATENCY 41MS</text>

  <!-- wordmark -->
  <text x="960" y="450" font-size="236" letter-spacing="26" font-weight="bold" fill="#5b78ff" opacity="0.5" filter="url(#glow)" text-anchor="middle">VERITAS</text>
  <text x="960" y="450" font-size="236" letter-spacing="26" font-weight="bold" fill="url(#wordGrad)" text-anchor="middle">VERITAS</text>

  <!-- divider -->
  <line x1="640" y1="498" x2="944" y2="498" stroke="#6c8cff" stroke-opacity="0.45" stroke-width="2"/>
  <line x1="976" y1="498" x2="1280" y2="498" stroke="#6c8cff" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M960 489 L969 498 L960 507 L951 498 Z" fill="#6c8cff"/>
  <circle cx="640" cy="498" r="3" fill="#6c8cff" opacity="0.8"/>
  <circle cx="1280" cy="498" r="3" fill="#6c8cff" opacity="0.8"/>

  <!-- subtitle -->
  <text x="965" y="552" font-size="33" letter-spacing="10" fill="#d9e2ff" text-anchor="middle">EXECUTION-AWARE OPTIONS AGENT</text>

  <!-- tagline -->
  <text x="960" y="606" font-size="27" letter-spacing="1" text-anchor="middle">
    <tspan fill="#93a6dd">LLM proposes</tspan>
    <tspan fill="#6c8cff" dx="10" dy="0">&#183;</tspan>
    <tspan fill="#93a6dd" dx="10" dy="0">math disposes</tspan>
  </text>

  <!-- decision pipeline -->
  <path d="M1322 690C1322 652 604 652 604 690" fill="none" stroke="#6c8cff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="7 7"/>
  <path d="M598 681 L610 681 L604 692 Z" fill="#6c8cff" opacity="0.5"/>
  <text x="963" y="648" font-size="15" letter-spacing="2" fill="#6c8cff" opacity="0.55" text-anchor="middle">AUTONOMOUS LOOP</text>

  <g stroke="#6c8cff" stroke-opacity="0.5" stroke-width="2">
    <line x1="688" y1="720" x2="724" y2="720"/>
    <line x1="894" y1="720" x2="930" y2="720"/>
    <line x1="1050" y1="720" x2="1084" y2="720"/>
    <line x1="1206" y1="720" x2="1240" y2="720"/>
  </g>
