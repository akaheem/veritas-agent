<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'JetBrains Mono', Consolas, monospace">
  <title>VERITAS - Execution-Aware Options Agent</title>
  <desc>Hackathon cover: dark terminal aesthetic with VERITAS wordmark, decision pipeline, option-chain motif and P&amp;L ticks.</desc>

  <defs>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#dde6ff"/>
      <stop offset="1" stop-color="#aebfff"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c8cff" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#6c8cff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="44%" r="78%">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="gridMinor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6c8cff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-25%" y="-45%" width="150%" height="190%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1920" height="1080" fill="#0b0e14"/>
  <ellipse cx="960" cy="400" rx="760" ry="300" fill="url(#centerGlow)"/>
  <rect width="1920" height="1080" fill="url(#gridMinor)"/>
  <path d="M200 0V1080 M400 0V1080 M600 0V1080 M800 0V1080 M1000 0V1080 M1200 0V1080 M1400 0V1080 M1600 0V1080 M1800 0V1080 M0 200H1920 M0 400H1920 M0 600H1920 M0 800H1920 M0 1000H1920" stroke="#6c8cff" stroke-opacity="0.06" stroke-width="1" fill="none"/>

  <!-- faint option-chain ladder (left) -->
  <g font-size="18">
    <g fill="#6c8cff" opacity="0.55" font-size="15" letter-spacing="2">
      <text x="110" y="288">STRIKE</text>
      <text x="205" y="288">MARK</text>
      <text x="305" y="288">&#916;</text>
    </g>
    <g fill="#8fa3d4" opacity="0.30">
      <text x="110" y="322">5980</text><text x="205" y="322">24.10</text><text x="305" y="322">0.81</text>
      <text x="110" y="360">5975</text><text x="205" y="360">20.35</text><text x="305" y="360">0.76</text>
      <text x="110" y="398">5970</text><text x="205" y="398">16.80</text><text x="305" y="398">0.71</text>
      <text x="110" y="436">5965</text><text x="205" y="436">13.45</text><text x="305" y="436">0.65</text>
      <text x="110" y="512">5955</text><text x="205" y="512">7.35</text><text x="305" y="512">0.51</text>
      <text x="110" y="550">5950</text><text x="205" y="550">4.90</text><text x="305" y="550">0.43</text>
      <text x="110" y="588">5945</text><text x="205" y="588">3.05</text><text x="305" y="588">0.34</text>
      <text x="110" y="626">5940</text><text x="205" y="626">1.75</text><text x="305" y="626">0.25</text>
      <text x="110" y="664">5935</text><text x="205" y="664">0.90</text><text x="305" y="664">0.17</text>
      <text x="110" y="702">5930</text><text x="205" y="702">0.40</text><text x="305" y="702">0.10</text>
    </g>
    <g>
