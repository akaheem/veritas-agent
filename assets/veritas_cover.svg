  <text x="1830" y="842" font-size="15" letter-spacing="3" fill="#3ddc97" text-anchor="end">LIVE</text>
  <line x1="1444" y1="856" x2="1828" y2="856" stroke="#6c8cff" stroke-opacity="0.15" stroke-width="1"/>

  <path d="M1444 906 L1498 896 L1544 902 L1596 878 L1622 892 L1652 886 L1694 868 L1738 876 L1784 854 L1828 846 L1828 920 L1444 920 Z" fill="#3ddc97" opacity="0.10"/>
  <path d="M1444 906 L1498 896 L1544 902 L1596 878 L1622 892 L1652 886 L1694 868 L1738 876 L1784 854 L1828 846" fill="none" stroke="#3ddc97" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M1596 878 L1622 892 L1652 886" fill="none" stroke="#ff7a7a" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>

  <path d="M1444 952 L1460 952 L1452 938 Z" fill="#3ddc97"/>
  <text x="1470" y="958" font-size="28" font-weight="bold" fill="#3ddc97">+$1,284.50</text>
  <text x="1806" y="958" font-size="22" font-weight="bold" fill="#ff7a7a" text-anchor="end">-$212.10</text>
  <path d="M1812 944 L1826 944 L1819 956 Z" fill="#ff7a7a"/>
