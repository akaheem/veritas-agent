  <g font-size="19" letter-spacing="1" text-anchor="middle">
    <rect x="528" y="692" width="152" height="56" rx="10" fill="#111624" stroke="#6c8cff" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="604" y="727" fill="#cfdbfa">SNAPSHOT</text>
    <rect x="734" y="692" width="152" height="56" rx="10" fill="#111624" stroke="#6c8cff" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="810" y="727" fill="#cfdbfa">VALIDATE</text>
    <rect x="940" y="692" width="102" height="56" rx="10" fill="#111624" stroke="#6c8cff" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="991" y="727" fill="#cfdbfa">RISK</text>
    <rect x="1096" y="692" width="102" height="56" rx="10" fill="#111624" stroke="#6c8cff" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="1147" y="727" fill="#cfdbfa">SIZE</text>
    <rect x="1252" y="692" width="140" height="56" rx="10" fill="#6c8cff"/>
    <text x="1322" y="727" fill="#0b0e14" font-weight="bold">EXECUTE</text>
  </g>

