    <path d="M734 720 L722 714 L722 726 Z"/>
    <path d="M940 720 L928 714 L928 726 Z"/>
    <path d="M1096 720 L1084 714 L1084 726 Z"/>
    <path d="M1252 720 L1240 714 L1240 726 Z"/>
