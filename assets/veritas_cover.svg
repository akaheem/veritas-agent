  <text x="1496" y="802" font-size="15" letter-spacing="2" font-weight="bold" fill="#0b0e14" text-anchor="middle">P&amp;L</text>
  <text x="1444" y="842" font-size="15" letter-spacing="3" fill="#7d8fbb">TODAY</text>
