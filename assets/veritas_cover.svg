  <path d="M134 976V1034 M214 992V1038 M294 972V1028 M454 980V1032 M694 976V1030 M774 988V1038 M854 980V1030 M1014 984V1034 M1174 978V1028 M1254 992V1038 M1414 988V1036 M1654 994V1038 M1814 998V1042" stroke="#6c8cff" stroke-opacity="0.12" stroke-width="2" fill="none"/>
  <path d="M120 988h28v34h-28z M200 1000h28v30h-28z M280 984h28v36h-28z M440 990h28v36h-28z M680 986h28v36h-28z M760 998h28v34h-28z M840 990h28v34h-28z M1000 994h28v34h-28z M1160 988h28v32h-28z M1240 1000h28v32h-28z M1400 996h28v34h-28z M1640 1002h28v30h-28z M1800 1006h28v30h-28z" fill="#6c8cff" opacity="0.12"/>
  <path d="M534 968V1022 M614 962V1018 M1094 972V1024 M1574 984V1032 M1734 986V1034" stroke="#3ddc97" stroke-opacity="0.18" stroke-width="2" fill="none"/>
  <path d="M520 978h28v36h-28z M600 972h28v38h-28z M1080 982h28v36h-28z M1560 994h28v32h-28z M1720 996h28v32h-28z" fill="#3ddc97" opacity="0.18"/>
  <path d="M374 998V1040 M934 996V1042 M1334 1000V1044 M1494 998V1042" stroke="#ff6b6b" stroke-opacity="0.18" stroke-width="2" fill="none"/>
  <path d="M360 1006h28v28h-28z M920 1004h28v32h-28z M1320 1008h28v30h-28z M1480 1006h28v30h-28z" fill="#ff6b6b" opacity="0.18"/>
  <line x1="96" y1="1048" x2="1824" y2="1048" stroke="#6c8cff" stroke-opacity="0.08" stroke-width="1"/>

